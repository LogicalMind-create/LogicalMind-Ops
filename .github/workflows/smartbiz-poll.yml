name: SmartBiz Order Scraper

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape-orders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        # Use --ignore-scripts to skip postinstall/prepare hooks that can fail in CI
        run: npm ci --ignore-scripts

      - name: Install Playwright + Chromium
        # Install playwright at package level (uses the version from package.json)
        run: |
          npx playwright install chromium --with-deps

      - name: Verify environment secrets
        run: |
          echo "Checking required secrets..."
          [[ -z "$SUPABASE_URL" ]] && echo "❌ SUPABASE_URL not set" || echo "✓ SUPABASE_URL set"
          [[ -z "$SUPABASE_SERVICE_KEY" ]] && echo "❌ SUPABASE_SERVICE_KEY not set" || echo "✓ SUPABASE_SERVICE_KEY set"
          [[ -z "$SMARTBIZ_EMAIL" ]] && echo "❌ SMARTBIZ_EMAIL not set" || echo "✓ SMARTBIZ_EMAIL set"
          [[ -z "$SMARTBIZ_PASSWORD" ]] && echo "❌ SMARTBIZ_PASSWORD not set" || echo "✓ SMARTBIZ_PASSWORD set"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMARTBIZ_EMAIL: ${{ secrets.SMARTBIZ_EMAIL }}
          SMARTBIZ_PASSWORD: ${{ secrets.SMARTBIZ_PASSWORD }}

      - name: Run SmartBiz Scraper
        # continue-on-error: prevents unexpected crashes (exit 1) from marking the
        # job as failed and triggering GitHub failure-notification emails.
        # Soft-fail paths in the script already exit(0) — this is a last-resort guard.
        continue-on-error: true
        id: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMARTBIZ_EMAIL: ${{ secrets.SMARTBIZ_EMAIL }}
          SMARTBIZ_PASSWORD: ${{ secrets.SMARTBIZ_PASSWORD }}
        run: node sc